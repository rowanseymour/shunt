<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shunt — route every link to the right browser">
  <defs>
    <path id="track-up" d="M 540 140 C 620 140 640 60 720 60 H 1150"/>
    <path id="track-mid" d="M 300 140 H 1150"/>
    <path id="track-down" d="M 540 140 C 620 140 640 220 720 220 H 1150"/>
  </defs>

  <!-- sleepers -->
  <g stroke="#d1d9e0" stroke-width="20" stroke-dasharray="5 11">
    <use href="#track-up"/>
    <use href="#track-mid"/>
    <use href="#track-down"/>
  </g>
  <!-- rails -->
  <g stroke="#59636e" stroke-width="11">
    <use href="#track-up"/>
    <use href="#track-mid"/>
    <use href="#track-down"/>
  </g>
  <!-- gap between rails -->
  <g stroke="#ffffff" stroke-width="7">
    <use href="#track-up"/>
    <use href="#track-mid"/>
    <use href="#track-down"/>
  </g>

  <!-- origin -->
  <circle cx="300" cy="140" r="8" fill="#ffffff" stroke="#59636e" stroke-width="4"/>

  <!-- railcar being shunted up the top branch -->
  <rect x="880" y="52" width="44" height="16" rx="5" fill="#0969da"/>

  <!-- termini -->
  <circle cx="1150" cy="60" r="10" fill="#0969da"/>
  <circle cx="1150" cy="140" r="10" fill="#1a7f37"/>
  <circle cx="1150" cy="220" r="10" fill="#bc4c00"/>

  <!-- wordmark -->
  <text x="68" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#1f2328">Shunt</text>
  <text x="71" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#59636e">Route every link to the right browser</text>
</svg>
