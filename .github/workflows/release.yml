name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: swift test

      - name: Build DMG
        run: bin/dmg "${GITHUB_REF_NAME#v}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Shunt-*.dmg --title "$GITHUB_REF_NAME" --generate-notes
